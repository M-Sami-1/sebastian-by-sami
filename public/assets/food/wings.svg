<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="grad-wings" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#E52320" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#250B08" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#grad-wings)"/>
  <!-- Decorative subtle background badge -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#E52320" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.3"/>
  
      <!-- Bucket / Bowl -->

      <stop offset="0%" stop-color="#52C41A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0F231D" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#grad-lemonade)"/>
  <!-- Decorative subtle background badge -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#52C41A" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.3"/>
  
      <!-- Glass -->
      <path d="M140 110 L155 290 Q200 300 245 290 L260 110 Z" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="3"/>
      <!-- Sparkling Green liquid -->
      <path d="M144 135 L155 285 Q200 295 245 285 L256 135 Z" fill="#2ECC71" fill-opacity="0.75"/>
